<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxury Rental</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=1600&q=80');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Poppins',sans-serif;
}

.welcome-container{

    width:900px;
    max-width:90%;

    padding:60px;

    text-align:center;

    background:rgba(0,0,0,0.35);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,215,0,0.3);

    border-radius:25px;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.6);
}

.logo{

    font-family:'Cinzel',serif;

    font-size:60px;

    color:#FFD700;

    letter-spacing:4px;

    text-shadow:
    0 0 20px rgba(255,215,0,0.6);

    margin-bottom:10px;
}

.star{

    font-size:40px;

    color:#FFD700;

    margin-bottom:20px;
}

.subtitle{

    color:white;

    font-size:24px;

    margin-bottom:40px;
}

.button-container{

    display:flex;

    justify-content:center;

    gap:40px;

    margin-top:30px;
}

.user-btn,
.admin-btn{

    width:300px;

    height:90px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
    135deg,
    #FFF3B0,
    #FFD700,
    #D4AF37,
    #B8860B
    );

    color:#111;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    transition:0.4s;

    box-shadow:
    0 10px 30px rgba(255,215,0,0.4);
}

.user-btn:hover,
.admin-btn:hover{

    transform:translateY(-5px);

    box-shadow:
    0 15px 40px rgba(255,215,0,0.8);
}

.footer-text{

    margin-top:35px;

    color:#FFD700;

    font-size:18px;
}

</style>
</head>

<body>

<div class="welcome-container">

<h1 class="logo">LUXURY RENTAL</h1>

<div class="star">✦</div>

<p class="subtitle">
Luxury Villas • Premium Apartments • Royal Resorts
</p>

<div class="button-container">

<button
class="user-btn"
onclick="window.location.href='index.html'">
USER
</button>

<button
class="admin-btn"
onclick="window.location.href='admin-home.html'">
ADMIN
</button>

</div>

<p class="footer-text">
✨ Where Luxury Meets Comfort ✨
</p>

</div>

</body>
</html>
