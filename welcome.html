<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxury Rental</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url('https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=1600&q=80');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Poppins',sans-serif;
}

.welcome-container{

    width:520px;
    max-width:90%;

    padding:40px;

    text-align:center;

    background:rgba(20,20,20,0.35);

    backdrop-filter:blur(14px);

    border:1px solid rgba(212,175,55,0.25);

    border-radius:25px;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.5);
}

.logo{

    font-family:'Cinzel',serif;

    font-size:50px;

    color:#D4AF37;

    letter-spacing:3px;

    text-shadow:
    0 0 15px rgba(212,175,55,0.5);

    margin-bottom:10px;
}

.star{

    font-size:40px;

    color:#D4AF37;

    margin-bottom:20px;
}

.subtitle{

    color:white;

    font-size:22px;

    font-weight:300;

    margin-bottom:30px;
}

.user-btn{

    width:100%;

    padding:18px;

    margin:10px 0;

    border:none;

    border-radius:15px;

    background:#6D071A;

    color:white;

    font-size:20px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

.user-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 20px rgba(109,7,26,0.8);
}

.admin-btn{

    width:100%;

    padding:18px;

    margin:10px 0;

    border:none;

    border-radius:15px;

    background:#D4AF37;

    color:black;

    font-size:20px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

.admin-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 20px rgba(212,175,55,0.8);
}

.footer-text{

    margin-top:25px;

    color:#D4AF37;

    font-size:16px;

    line-height:1.8;
}

</style>
</head>

<body>

<div class="welcome-container">

    <h1 class="logo">
        LUXURY RENTAL
    </h1>

    <div class="star">✦</div>

    <p class="subtitle">
        ✨ Where Luxury Meets Comfort
    </p>

    <button
        class="user-btn"
        onclick="window.location.href='index.html'">

        User View

    </button>

    <button
        class="admin-btn"
        onclick="window.location.href='admin-login.html'">

        Admin View

    </button>

    <p class="footer-text">
        Luxury Villas • Apartments • Penthouses • Resorts
    </p>

</div>

</body>
</html>
